version: "1.0"

# ─── FASES ───────────────────────────────────────────────────────

fases:
  - numero: 1
    nombre: "Down-training (semanas 1-4)"
    semanas: 4
    objetivo: "Desensibilización del suelo pélvico hipertónico mediante relajación y movilidad"
    ejercicios:
      - id: breathing_diaphragmatic
        dosis_minima: true
      - id: stretch_adductors_lunge
        dosis_minima: true
      - id: mobility_hip_circles
        dosis_minima: true
      - id: mobility_cat_cow
        dosis_minima: true
    criterios_pasaje:
      - tipo: adherencia_minima
        valor: 75
      - tipo: tension_basal_max
        valor: 6
      - tipo: registros_con_tension_baja
        valor: 3
      - tipo: sin_empeoramiento_sintomas
        valor: null

  - numero: 2
    nombre: "Transición (semanas 5-8)"
    semanas: 4
    objetivo: "Consolidar relajación e introducir relajación profunda"
    ejercicios:
      - id: breathing_diaphragmatic
        dosis_minima: true
      - id: stretch_adductors_lunge
        dosis_minima: true
      - id: mobility_hip_circles
        dosis_minima: true
      - id: mobility_cat_cow
        dosis_minima: true
      - id: breathing_478
        dosis_minima: false
    criterios_pasaje:
      - tipo: adherencia_minima
        valor: 75
      - tipo: tension_basal_max
        valor: 5
      - tipo: registros_con_tension_baja
        valor: 5
      - tipo: sin_empeoramiento_sintomas
        valor: null

  - numero: 3
    nombre: "Up-training (semanas 9-12)"
    semanas: 4
    objetivo: "Fortalecimiento del suelo pélvico (solo si hipertonía resuelta)"
    ejercicios:
      - id: breathing_diaphragmatic
        dosis_minima: false
      - id: mobility_hip_circles
        dosis_minima: false
      - id: mobility_cat_cow
        dosis_minima: false
      - id: kegel_fast
        dosis_minima: false
      - id: kegel_sustained
        dosis_minima: false
    criterios_pasaje:
      - tipo: adherencia_minima
        valor: 75

# ─── EJERCICIOS ──────────────────────────────────────────────────

ejercicios:
  # ─ DOWN-TRAINING (Relajación)
  - id: breathing_diaphragmatic
    nombre: "Respiración diafragmática"
    pilar: down-training
    dosis:
      series: 1
      ciclos: 10
      seg_inhalacion: 4
      seg_exhalacion: 6
    minutos_estimados: 3
    dosis_minima: true
    nivel_evidencia: consenso_clinico
    vigencia_desde: "2026-09-18"
    vigencia_hasta: null
    activo: true

  - id: stretch_adductors_lunge
    nombre: "Estiramiento de aductores en estocada"
    pilar: down-training
    dosis:
      series: 2
      seg_inhalacion: 30
      descanso_entre_series: 15
    minutos_estimados: 2
    dosis_minima: true
    nivel_evidencia: consenso_clinico
    vigencia_desde: "2026-09-18"
    vigencia_hasta: null
    activo: true

  - id: breathing_478
    nombre: "Respiración 4-7-8"
    pilar: down-training
    dosis:
      series: 1
      ciclos: 5
      seg_inhalacion: 4
      seg_contraccion: 7
      seg_exhalacion: 8
    minutos_estimados: 5
    dosis_minima: false
    nivel_evidencia: moderado
    vigencia_desde: "2026-09-18"
    vigencia_hasta: null
    activo: true

  # ─ MOVILIDAD
  - id: mobility_hip_circles
    nombre: "Movilidad de cadera — círculos"
    pilar: movilidad
    dosis:
      series: 1
      repeticiones: 10
    minutos_estimados: 2
    dosis_minima: true
    nivel_evidencia: consenso_clinico
    vigencia_desde: "2026-09-18"
    vigencia_hasta: null
    activo: true

  - id: mobility_cat_cow
    nombre: "Gato-vaca"
    pilar: movilidad
    dosis:
      series: 1
      repeticiones: 10
    minutos_estimados: 2
    dosis_minima: true
    nivel_evidencia: consenso_clinico
    vigencia_desde: "2026-09-18"
    vigencia_hasta: null
    activo: true

  # ─ UP-TRAINING (Fuerza) — BLOQUEADOS EN HIPERTÓNICO
  - id: kegel_fast
    nombre: "Kegel de fuerza — rápidos"
    pilar: up-training
    dosis:
      series: 2
      repeticiones: 10
      seg_contraccion: 1
      seg_relajacion: 1
      descanso_entre_series: 20
    minutos_estimados: 3
    dosis_minima: false
    nivel_evidencia: alto
    habilitacion_condicion:
      tipo: escenario_funcional
      valor_excluido: hipertonico
    vigencia_desde: "2026-09-18"
    vigencia_hasta: null
    activo: true

  - id: kegel_sustained
    nombre: "Kegel de fuerza — sostenidos"
    pilar: up-training
    dosis:
      series: 2
      seg_contraccion: 5
      seg_relajacion: 10
      descanso_entre_series: 30
    minutos_estimados: 4
    dosis_minima: false
    nivel_evidencia: alto
    habilitacion_condicion:
      tipo: escenario_funcional
      valor_excluido: hipertonico
    vigencia_desde: "2026-09-18"
    vigencia_hasta: null
    activo: true

# ─── REGISTRO DIARIO ─────────────────────────────────────────────

registro_diario:
  - variable: tension_basal
    escala_minima: 0
    escala_maxima: 10
    obligatorio: true
    descripcion: "Tensión de reposo del suelo pélvico (0=relajado, 10=máxima contracción)"

  - variable: control
    escala_minima: 0
    escala_maxima: 10
    obligatorio: false
    descripcion: "Sensación de control consciente (0=no siento, 10=máximo control)"

  - variable: sintomas
    escala_minima: 0
    escala_maxima: 10
    obligatorio: false
    descripcion: "Presencia de síntomas (0=ausente, 10=severo e incapacitante)"
