version: "1.0"

# ─── FASES ───────────────────────────────────────────────────────

fases:
  - numero: 1
    nombre: "Down-training (semanas 1-4)"
    semanas: 4
    objetivo: "Desensibilizacion del suelo pelvico hipertonico mediante relajacion y movilidad"
    ejercicios:
      - id: breathing_diaphragmatic
        dosis_minima: true
      - id: stretch_adductors_lunge
        dosis_minima: true
      - id: mobility_hip_circles
        dosis_minima: true
      - id: mobility_cat_cow
        dosis_minima: true
    criterios_pasaje:
      - tipo: adherencia_minima
        valor: 75
      - tipo: tension_basal_max
        valor: 6
      - tipo: registros_con_tension_baja
        valor: 3
      - tipo: sin_empeoramiento_sintomas
        valor: null

  - numero: 2
    nombre: "Transicion (semanas 5-8)"
    semanas: 4
    objetivo: "Consolidar relajacion e introducir relajacion profunda"
    ejercicios:
      - id: breathing_diaphragmatic
        dosis_minima: true
      - id: stretch_adductors_lunge
        dosis_minima: true
      - id: mobility_hip_circles
        dosis_minima: true
      - id: mobility_cat_cow
        dosis_minima: true
      - id: breathing_478
        dosis_minima: false
    criterios_pasaje:
      - tipo: adherencia_minima
        valor: 75
      - tipo: tension_basal_max
        valor: 5
      - tipo: registros_con_tension_baja
        valor: 5
      - tipo: sin_empeoramiento_sintomas
        valor: null

  - numero: 3
    nombre: "Up-training (semanas 9-12)"
    semanas: 4
    objetivo: "Fortalecimiento del suelo pelvico (solo si hipertonia resuelta)"
    ejercicios:
      - id: breathing_diaphragmatic
        dosis_minima: false
      - id: mobility_hip_circles
        dosis_minima: false
      - id: mobility_cat_cow
        dosis_minima: false
      - id: kegel_fast
        dosis_minima: false
      - id: kegel_sustained
        dosis_minima: false
    criterios_pasaje:
      - tipo: adherencia_minima
        valor: 75

# ─── EJERCICIOS ──────────────────────────────────────────────────

ejercicios:
  # ─ DOWN-TRAINING (Relajacion)
  - id: breathing_diaphragmatic
    nombre: "Respiracion diafragmatica"
    pilar: down-training
    dosis:
      series: 1
      ciclos: 10
      seg_inhalacion: 4
      seg_exhalacion: 6
    minutos_estimados: 3
    dosis_minima: true
    nivel_evidencia: consenso_clinico
    vigencia_desde: "2026-09-18"
    vigencia_hasta: null
    activo: true
    instrucciones: |
      Posicion: sentado o acostado, espalda recta.
      Ciclo (10 repeticiones):
      1. Inhalacion nasal lenta (4 segundos) — el suelo pelvico desciende
      2. Pausa (2 segundos)
      3. Exhalacion bucal lenta (6 segundos)
    senales_correctas:
      - El abdomen baja (no se hincha) en la inhalacion
      - La respiracion es silenciosa y sin tension
      - Sientes relajacion en el suelo pelvico
    senales_error:
      - Los hombros suben (estas usando el pecho, no el diafragma)
      - La inhalacion es rapida o superficial
      - Tension en cuello o mandibula

  - id: stretch_adductors_lunge
    nombre: "Estiramiento de aductores en estocada"
    pilar: down-training
    dosis:
      series: 2
      seg_inhalacion: 30
      descanso_entre_series: 15
    minutos_estimados: 2
    dosis_minima: true
    nivel_evidencia: consenso_clinico
    vigencia_desde: "2026-09-18"
    vigencia_hasta: null
    activo: true
    instrucciones: |
      Posicion de estocada baja: una pierna adelante (rodilla doblada 90°), la otra atras (talon levantado).
      Manten 30 segundos sin forzar. El suelo pelvico baja por el estiramiento.
      Descansa 15 segundos.
      Repite 2 series (puedes alternar piernas o hacer ambas del mismo lado).
    senales_correctas:
      - Sientes el estiramiento en la cara interna del muslo (aductores)
      - La pelvis se relaja (baja el suelo pelvico)
      - Respiracion profunda y sin tension
    senales_error:
      - Rodilla delantera pasa la punta del pie (riesgo de lesion)
      - Torso inclinado hacia adelante
      - Contraccion en lugar de relajacion

  - id: breathing_478
    nombre: "Respiracion 4-7-8"
    pilar: down-training
    dosis:
      series: 1
      ciclos: 5
      seg_inhalacion: 4
      seg_contraccion: 7
      seg_exhalacion: 8
    minutos_estimados: 5
    dosis_minima: false
    nivel_evidencia: moderado
    vigencia_desde: "2026-09-18"
    vigencia_hasta: null
    activo: true
    instrucciones: |
      Posicion: sentado comodo, espalda recta, ojos cerrados.
      Ciclo (5 repeticiones):
      1. Inhalacion nasal (4 segundos)
      2. Retencion (7 segundos) — el suelo pelvico desciende pero se estabiliza
      3. Exhalacion bucal lenta (8 segundos)
      Este ejercicio induce un estado profundo de relajacion.
    senales_correctas:
      - La retencion de 7 segundos es comoda (no fuerces)
      - Sientes relajacion profunda despues
      - El suelo pelvico desciende sin contraccion
    senales_error:
      - Panico o aceleracion del ritmo cardiaco
      - Contraccion voluntaria del suelo pelvico
      - Mareos (reduci el numero de ciclos a 3-4)

  # ─ MOVILIDAD
  - id: mobility_hip_circles
    nombre: "Movilidad de cadera — circulos"
    pilar: movilidad
    dosis:
      series: 1
      repeticiones: 10
    minutos_estimados: 2
    dosis_minima: true
    nivel_evidencia: consenso_clinico
    vigencia_desde: "2026-09-18"
    vigencia_hasta: null
    activo: true
    instrucciones: |
      Posicion: de pie, manos en cintura, pies separados ancho de caderas.
      Haz 10 circulos amplios con las caderas en sentido horario.
      Luego 10 circulos en sentido antihorario.
      Movimiento lento y controlado; respira profundo.
    senales_correctas:
      - Las caderas trazan un circulo completo y amplio
      - El suelo pelvico se relaja (desciende) en la parte trasera del circulo
      - Respiracion profunda y sin tension
    senales_error:
      - Movimiento pequeño o tenso
      - Contraccion de gluteos o abdomen
      - Rigidez en la pelvis

  - id: mobility_cat_cow
    nombre: "Gato-vaca"
    pilar: movilidad
    dosis:
      series: 1
      repeticiones: 10
    minutos_estimados: 2
    dosis_minima: true
    nivel_evidencia: consenso_clinico
    vigencia_desde: "2026-09-18"
    vigencia_hasta: null
    activo: true
    instrucciones: |
      Posicion: a cuatro puntos (manos bajo hombros, rodillas bajo caderas).
      Ciclo (10 repeticiones):
      1. VACA: inhalacion, baja el pecho y levanta la cabeza suavemente, el suelo pelvico desciende
      2. GATO: exhalacion, redondea la columna, mete la cabeza, contrae abdomen suavemente
      Movimiento fluido y sincronizado con la respiracion.
    senales_correctas:
      - La columna se mueve como una onda
      - La respiracion sincroniza con el movimiento
      - El suelo pelvico desciende en la inhalacion (vaca)
    senales_error:
      - Movimiento rigido o por tramos
      - Cabeza caida (mira al frente)
      - Desincronizacion con la respiracion

  # ─ UP-TRAINING (Fuerza) — BLOQUEADOS EN HIPERTONICO
  - id: kegel_fast
    nombre: "Kegel de fuerza — rapidos"
    pilar: up-training
    dosis:
      series: 2
      repeticiones: 10
      seg_contraccion: 1
      seg_relajacion: 1
      descanso_entre_series: 20
    minutos_estimados: 3
    dosis_minima: false
    nivel_evidencia: alto
    habilitacion_condicion:
      tipo: escenario_funcional
      valor_excluido: hipertonico
    vigencia_desde: "2026-09-18"
    vigencia_hasta: null
    activo: true
    instrucciones: |
      ⚠️ SOLO FASE 3 — Solo si la tension basal es ≤5
      Contraccion maxima rapida del suelo pelvico.
      Ciclo (10 repeticiones):
      1. Contraccion maxima rapida (1 segundo)
      2. Relajacion completa (1 segundo)
      Series: 2 • Descanso entre series: 20 segundos
      Posicion: sentado o acostado comodo.
    senales_correctas:
      - Contraccion clara y maxima (como frenar un chorro de orina)
      - Relajacion completa entre cada una
      - Sin tension en abdomen, gluteos o muslos
    senales_error:
      - Contraccion debil o incompleta
      - Retencion de mas de 1 segundo
      - Tension en abdomen o gluteos
      - Dolor (deten inmediatamente)

  - id: kegel_sustained
    nombre: "Kegel de fuerza — sostenidos"
    pilar: up-training
    dosis:
      series: 2
      seg_contraccion: 5
      seg_relajacion: 10
      descanso_entre_series: 30
    minutos_estimados: 4
    dosis_minima: false
    nivel_evidencia: alto
    habilitacion_condicion:
      tipo: escenario_funcional
      valor_excluido: hipertonico
    vigencia_desde: "2026-09-18"
    vigencia_hasta: null
    activo: true
    instrucciones: |
      ⚠️ SOLO FASE 3 — Solo si la tension basal es ≤5
      Contraccion maxima sostenida del suelo pelvico.
      Semana 1-4: contraccion 5 seg / relajacion 10 seg
      Aumenta 1 segundo/semana (hasta 10 seg maximo)
      Series: 2 • Descanso entre series: 30 segundos
      Posicion: sentado o acostado comodo.
    senales_correctas:
      - Contraccion maxima pero sostenible sin temblor
      - Relajacion profunda (el doble de la contraccion)
      - Sin tension en abdomen, gluteos o muslos
      - Recuperacion gradual semana a semana
    senales_error:
      - Contraccion debil o con temblor
      - Relajacion insuficiente (menos del doble)
      - Tension en abdomen o gluteos
      - Fatiga excesiva (reduce las series)
      - Dolor (deten inmediatamente)

# ─── REGISTRO DIARIO ─────────────────────────────────────────────

registro_diario:
  - variable: tension_basal
    escala_minima: 0
    escala_maxima: 10
    obligatorio: true
    descripcion: "Tension de reposo del suelo pelvico (0=relajado, 10=maxima contraccion)"

  - variable: control
    escala_minima: 0
    escala_maxima: 10
    obligatorio: false
    descripcion: "Sensacion de control consciente (0=no siento, 10=maximo control)"

  - variable: sintomas
    escala_minima: 0
    escala_maxima: 10
    obligatorio: false
    descripcion: "Presencia de sintomas (0=ausente, 10=severo e incapacitante)"
